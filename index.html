<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Грув</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
[data-theme=arbuz]{--bg:#121813;--panel:#182019;--card:#212c23;--card2:#263329;--line:#33443a;--ink:#e8f0e1;--muted:#b4c2ae;--accent:#b5d86a;--accent-ink:#172008;--hot:#ff8a5c;--c0:#b5d86a;--c1:#ff8a5c;--c2:#5ec8e5;--c3:#f2c94c;--c4:#c58af9;--c5:#ff6f91;--c6:#5fd9aa;--c7:#8fa8ff}
[data-theme=asiimov]{--bg:#e9e8e3;--panel:#f5f4f0;--card:#ffffff;--card2:#eeede8;--line:#b9b6ab;--ink:#141414;--muted:#4a4843;--accent:#ff6a13;--accent-ink:#141414;--hot:#141414;--c0:#5f9a12;--c1:#e0541a;--c2:#1688b0;--c3:#b88a00;--c4:#8a4fd6;--c5:#d63a66;--c6:#14916a;--c7:#4862d8}
[data-theme=night]{--bg:#101114;--panel:#16181c;--card:#1f2227;--card2:#262a31;--line:#343944;--ink:#eceef2;--muted:#b3b8c4;--accent:#5ec8e5;--accent-ink:#04222b;--hot:#ff7b7b;--c0:#b5d86a;--c1:#ff8a5c;--c2:#5ec8e5;--c3:#f2c94c;--c4:#c58af9;--c5:#ff6f91;--c6:#5fd9aa;--c7:#8fa8ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:2px solid transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:grid;grid-template-rows:54px minmax(0,1fr) 292px;min-width:1080px;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--card2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.accent,button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
select,input[type=number],input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
input[type=range]{accent-color:var(--accent);height:18px;margin:0;min-width:0}
.mono{font-family:"Cascadia Mono",Consolas,monospace}
.grow{flex:1}
.muted{color:var(--muted)}

body.notes{grid-template-rows:54px minmax(0,1fr) min(390px,46vh)}
#top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px;margin-right:6px}
.logo i{color:var(--accent);font-style:normal}
#playBtn{min-width:112px;height:36px;font-size:15px;padding:0 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
body.playing #playBtn{background:var(--hot);border-color:var(--hot);color:#fff}
.fld{display:flex;align-items:center;gap:6px;color:var(--muted)}
.fld input[type=number]{width:58px;text-align:center;color:var(--ink);font-weight:600}
.fld input[type=range]{width:90px}
.fld button{padding:3px 9px}
#meter{border:1px solid var(--line);border-radius:4px;background:var(--card)}

main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0}
#lib{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:10px 10px 0}
.tabs button{flex:1;padding:6px 4px}
#lib .tools{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}
#lib .tools input[type=search]{flex:1 1 100%;width:100%}
#lib .tools button{flex:1}
#list{flex:1;overflow-y:auto;padding:0 6px 10px}
.grp{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 6px 4px}
.grp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp button,.it button{padding:0;width:24px;height:24px;line-height:1;flex:none}
.it{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:7px;cursor:pointer}
.it:hover{background:var(--card)}
.it .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .pv{color:var(--accent);width:14px;flex:none;font-size:10px}
.it .x{opacity:0;border:none;background:none;color:var(--muted)}
.it:hover .x{opacity:1}
.dropHint{margin:6px 6px 0;padding:14px 10px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;line-height:1.5}
.dropHint b{color:var(--ink)}

#work{display:flex;flex-direction:column;min-width:0;min-height:0}
#patbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#patbar .pb{min-width:32px;font-weight:700}
#patbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
.seg button:last-child{border-radius:0 7px 7px 0}
#rowsWrap{flex:1;overflow-y:auto;min-height:0;padding:8px 12px}
#rows{position:relative;--thw:292px}
.row{display:flex;align-items:stretch;height:36px;border-radius:8px}
.row.sel{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.ruler{display:flex;height:18px;font-size:11px;color:var(--muted)}
.ruler i{width:var(--thw);flex:none}
.ruler .cells div{padding-left:5px;font-family:"Cascadia Mono",Consolas,monospace}
.row.over{outline:2px dashed var(--accent)}
.th{width:var(--thw);flex:none;display:flex;align-items:center;gap:5px;padding:0 8px 0 6px}
.chip{width:6px;height:22px;border-radius:3px;flex:none}
.tname{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:5px;padding:3px 4px;font-weight:600;text-overflow:ellipsis}
.tname:hover{border-color:var(--line)}
.kind{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex:none;margin-right:4px}
.th button{padding:0;width:24px;height:24px;font-size:11px;font-weight:700;flex:none}
.th button.on.s{background:#f2c94c;border-color:#f2c94c;color:#221a00}
.th button.on.m{background:var(--hot);border-color:var(--hot);color:#fff}
.th .del{border:none;background:none;color:var(--muted);font-size:15px}
.tvol{width:62px;flex:none}
.cells{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));min-width:0}
.c{margin:3px 2px;border-radius:5px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.c.q{background:var(--card2);border-color:color-mix(in srgb,var(--line) 60%,var(--ink))}
.c:hover{border-color:var(--ink)}
.c.on{background:var(--tc)!important;border-color:var(--tc)}
.c.hold{background:color-mix(in srgb,var(--tc) 30%,var(--card))!important;border-color:transparent;margin-left:-2px;border-radius:0 5px 5px 0}
.row.off .c.on,.row.off .c.hold{opacity:.35}
.ph{position:absolute;top:18px;bottom:0;pointer-events:none;background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:5px;display:none;left:calc(var(--thw) + (100% - var(--thw)) * var(--ph,0) / var(--n));width:calc((100% - var(--thw)) / var(--n))}
body.playing .ph,body.playing .rph{display:block}
.addrow{display:flex;gap:8px;align-items:center;padding:10px 6px;color:var(--muted)}
#song{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap;min-height:46px}
#song .lbl{font-weight:700;margin-right:4px}
.sc{min-width:30px;font-weight:700;padding:4px 8px}
.sc.now{outline:2px solid var(--accent)}
.sadd{border-style:dashed;font-weight:400}

#dev{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dh{display:flex;align-items:center;gap:8px;padding:8px 12px;height:42px;flex:none}
.dh b{font-size:14px}
.dh select{padding:3px 6px}
.dbody{flex:1;min-height:0;display:flex;gap:10px;padding:0 12px 12px;overflow-x:auto}
.dv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:232px;flex:none;display:flex;flex-direction:column;gap:7px}
.dv.offd .k{opacity:.62}
.dv h4{margin:0 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;height:24px}
.dv h4 button{padding:2px 9px;font-size:11px;letter-spacing:0;text-transform:none}
.k{display:grid;grid-template-columns:74px minmax(0,1fr) 54px;align-items:center;gap:6px}
.k>span{color:var(--muted)}
.k output{text-align:right;font-size:12px;font-family:"Cascadia Mono",Consolas,monospace}
.k select{grid-column:2/4}
.chk{display:flex;gap:7px;align-items:center;color:var(--muted)}
.srcname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll{flex:1;min-height:0;margin:0 12px 12px;border:1px solid var(--line);border-radius:10px;overflow-y:auto;display:grid;grid-template-columns:50px minmax(0,1fr);background:var(--card)}
.keys div{height:14px;font-size:10px;line-height:13px;padding-left:5px;color:var(--ink);font-family:"Cascadia Mono",Consolas,monospace;border-bottom:1px solid var(--line);background:var(--card2)}
.keys .bk{background:var(--bg);color:var(--muted)}
.keys .cn{color:var(--ink);font-weight:700}
.area{position:relative;cursor:crosshair;--n:16}
.area .r{height:14px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.area .r.bk{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.area .r.dim{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--line) 60%,transparent) 4px 5px)}
.area .vl{position:absolute;inset:0;pointer-events:none;background:
 repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100% / var(--n)));opacity:.55}
.area .vb{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(400% / var(--n)),color-mix(in srgb,var(--ink) 5%,transparent) calc(400% / var(--n)) calc(800% / var(--n)))}
.note{position:absolute;height:13px;border-radius:3px;background:var(--tc);border:1px solid rgba(0,0,0,.35);cursor:pointer}
.rph{position:absolute;top:0;bottom:0;pointer-events:none;display:none;background:color-mix(in srgb,var(--accent) 20%,transparent);left:calc(100% * var(--ph,0) / var(--n));width:calc(100% / var(--n))}
.empty{margin:auto;color:var(--muted);text-align:center;line-height:1.7}

#menu{position:fixed;top:50px;right:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;display:flex;flex-direction:column;gap:2px;min-width:250px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#menu button{border:none;background:none;text-align:left;padding:8px 10px}
#menu button:hover{background:var(--card2)}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 0;width:100%}
#menu .th3{display:flex;gap:4px;padding:4px 6px}
#menu .th3 button{flex:1;text-align:center;border:1px solid var(--line)}
#menu .th3 button.on{background:var(--accent);color:var(--accent-ink)}
#help{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:grid;place-items:center}
#help .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;width:560px;max-width:92vw;user-select:text}
#help h3{margin:0 0 10px;font-size:18px}
#help ol{margin:0 0 14px;padding-left:20px;line-height:1.75}
#help kbd{font-family:"Cascadia Mono",Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--card2)}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70vw;text-align:center}
#toast.show{opacity:1}
#drop{position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:50;display:none;place-items:center;font-size:22px;font-weight:700;pointer-events:none}
body.dragging #drop{display:grid}
</style>
</head>
<body data-theme="arbuz">
<header id="top">
  <div class="logo">ГР<i>У</i>В</div>
  <button id="playBtn" data-act="play" title="Пробел">▶ Играть</button>
  <div class="fld">Темп <button data-act="bpm" data-v="-1">−</button><input id="bpm" type="number" min="40" max="240" class="mono"><button data-act="bpm" data-v="1">+</button></div>
  <div class="fld" title="Сдвигает каждую вторую долю — бит начинает «качать»">Свинг <input id="swing" type="range" min="0" max="0.6" step="0.02"></div>
  <span class="grow"></span>
  <canvas id="meter" width="96" height="14" title="Уровень звука"></canvas>
  <div class="fld">Громкость <input id="master" type="range" min="0" max="1" step="0.01"></div>
  <button data-act="undo" title="Ctrl+Z">↶ Отмена</button>
  <button data-act="export" class="accent" title="Готовый трек файлом в папку «Загрузки»">Сохранить WAV</button>
  <button data-act="menu" title="Меню">☰ Меню</button>
</header>
<main>
  <aside id="lib">
    <div class="tabs" id="libTabs"></div>
    <div class="tools" id="libTools"></div>
    <div id="list"></div>
  </aside>
  <section id="work">
    <div id="patbar"></div>
    <div id="rowsWrap"><div id="rows"></div></div>
    <div id="song"></div>
  </section>
</main>
<footer id="dev"></footer>
<div id="menu" hidden></div>
<div id="help" hidden></div>
<div id="toast"></div>
<div id="drop">Отпусти — звуки попадут в «Мои звуки»</div>
<input type="file" id="fFiles" multiple accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a,.aac,.aif,.aiff,.opus" hidden>
<input type="file" id="fDir" webkitdirectory hidden>
<input type="file" id="fProj" accept=".json" hidden>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const SR=44100, NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const RU_NOTE=['До','До#','Ре','Ре#','Ми','Фа','Фа#','Соль','Соль#','Ля','Ля#','Си'];
const COLORS=[0,1,2,3,4,5,6,7].map(i=>'var(--c'+i+')');
const NMIN=24,NMAX=83,RH=14;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- встроенные звуки: считаются математикой, без файлов ---------- */
const rnd=()=>Math.random()*2-1;
const envf=(t,a,d)=>t<0?0:t<a?t/a:Math.exp(-(t-a)/d);
function tone(d,o){const {f0,f1=f0,drop=.05,dec,amp=1,type='sine',atk=.001}=o;let ph=0;for(let i=0;i<d.length;i++){const t=i/SR,f=f1+(f0-f1)*Math.exp(-t/drop);ph+=2*Math.PI*f/SR;let s=Math.sin(ph);if(type==='square')s=s>0?1:-1;else if(type==='tri')s=2/Math.PI*Math.asin(s);d[i]+=s*amp*envf(t,atk,dec);}}
function noise(d,o){const {dec,amp=1,hp=0,lp=1,atk=.001,start=0}=o;let l=0,h=0;for(let i=Math.floor(start*SR);i<d.length;i++){const t=i/SR-start;let x=rnd();l+=lp*(x-l);x=l;h+=hp*(x-h);x-=h;d[i]+=x*amp*envf(t,atk,dec);}}
function sat(d,k){for(let i=0;i<d.length;i++)d[i]=Math.tanh(d[i]*k);}
const BUILTIN=[
 ['kick','Кик','Бочки',.5,d=>{tone(d,{f0:150,f1:45,drop:.04,dec:.2});noise(d,{dec:.004,amp:.3})}],
 ['kick808','Кик 808 длинный','Бочки',1.4,d=>{tone(d,{f0:125,f1:43,drop:.06,dec:.6});sat(d,1.7)}],
 ['kickhard','Кик жёсткий','Бочки',.4,d=>{tone(d,{f0:230,f1:52,drop:.024,dec:.15});noise(d,{dec:.003,amp:.4});sat(d,3)}],
 ['kicksoft','Кик мягкий','Бочки',.5,d=>{tone(d,{f0:95,f1:48,drop:.06,dec:.22})}],
 ['snare','Снейр','Снейры и клэпы',.35,d=>{tone(d,{f0:200,f1:165,drop:.03,dec:.08,amp:.6});noise(d,{dec:.12,amp:.8,hp:.25})}],
 ['snare2','Снейр плотный','Снейры и клэпы',.45,d=>{tone(d,{f0:230,f1:175,drop:.03,dec:.11,amp:.7});noise(d,{dec:.19,amp:.8,hp:.1,lp:.6});sat(d,1.6)}],
 ['clap','Клэп','Снейры и клэпы',.45,d=>{for(const s of[0,.011,.023])noise(d,{start:s,dec:.007,amp:.8,hp:.3,lp:.7});noise(d,{start:.034,dec:.11,amp:.8,hp:.3,lp:.7})}],
 ['rim','Римшот','Снейры и клэпы',.12,d=>{tone(d,{f0:820,dec:.012,type:'square',amp:.4});tone(d,{f0:1720,dec:.008,amp:.6})}],
 ['snap','Щелчок','Снейры и клэпы',.16,d=>{noise(d,{dec:.018,hp:.5});tone(d,{f0:1500,dec:.01,amp:.4})}],
 ['hat','Хэт закрытый','Хэты и тарелки',.12,d=>noise(d,{dec:.028,hp:.8})],
 ['ohat','Хэт открытый','Хэты и тарелки',.6,d=>noise(d,{dec:.2,hp:.8})],
 ['shaker','Шейкер','Хэты и тарелки',.2,d=>noise(d,{atk:.02,dec:.045,hp:.6,lp:.8})],
 ['ride','Райд','Хэты и тарелки',1.2,d=>{noise(d,{dec:.45,hp:.85,amp:.6});tone(d,{f0:5200,dec:.4,type:'square',amp:.08})}],
 ['crash','Крэш','Хэты и тарелки',2,d=>noise(d,{dec:.75,hp:.6})],
 ['tomL','Том низкий','Перкуссия',.6,d=>tone(d,{f0:150,f1:82,drop:.08,dec:.24})],
 ['tomH','Том высокий','Перкуссия',.5,d=>tone(d,{f0:250,f1:150,drop:.07,dec:.2})],
 ['conga','Конга','Перкуссия',.3,d=>{tone(d,{f0:420,f1:330,drop:.02,dec:.1});noise(d,{dec:.006,amp:.25})}],
 ['cowbell','Ковбелл','Перкуссия',.35,d=>{tone(d,{f0:540,dec:.11,type:'square',amp:.5});tone(d,{f0:800,dec:.11,type:'square',amp:.5})}],
 ['sub','808 бас (нота Ля)','Бас и эффекты',1.3,d=>{tone(d,{f0:75,f1:55,drop:.02,dec:.7});sat(d,2)}],
 ['laser','Лазер','Бас и эффекты',.3,d=>tone(d,{f0:2600,f1:200,drop:.06,dec:.14,type:'square',amp:.6})],
 ['impact','Удар-бум','Бас и эффекты',2,d=>{tone(d,{f0:95,f1:30,drop:.2,dec:.7});noise(d,{dec:.5,lp:.08,amp:1.5})}],
 ['riser','Подъём (шум)','Бас и эффекты',2,d=>{let l=0;for(let i=0;i<d.length;i++){const t=i/SR,k=t/2;l+=(.02+k*k*.9)*(rnd()-l);d[i]=l*k*k*(t>1.97?(2-t)/.03:1)*2}}],
];
const BUF=new Map(), BNAME={};
function genBuiltins(){for(const [id,name,cat,dur,fn] of BUILTIN){const d=new Float32Array(Math.floor(dur*SR));fn(d);let p=0;for(let i=0;i<d.length;i++)p=Math.max(p,Math.abs(d[i]));const fo=Math.min(600,d.length);for(let i=0;i<d.length;i++){let g=.9/(p||1);if(i>d.length-fo)g*=(d.length-i)/fo;d[i]*=g}const b=new AudioBuffer({length:d.length,sampleRate:SR,numberOfChannels:1});b.copyToChannel(d,0);BUF.set('b:'+id,b);BNAME['b:'+id]=name;}}

/* ---------- синтезаторы ---------- */

  play.q.push({t,step:play.step,pi,pos:play.pos});play.next+=sd;play.step++;

function areaPos(e){const ar=$('#area'),r=ar.getBoundingClientRect(),p=P();return {s:clamp(Math.floor((e.clientX-r.left)/r.width*p.len),0,p.len-1),n:clamp(NMAX-Math.floor((e.clientY-r.top)/RH),NMIN,NMAX)}}
dev.addEventListener('mousedown',e=>{const ar=e.target.closest('#area');if(!ar)return;e.preventDefault();const tr=T(sel),ns=notes(P(),tr.id);pushUndo();
 if(e.target.classList.contains('note')){const s=+e.target.dataset.s,n=+e.target.dataset.n,i=ns.findIndex(x=>x.s===s&&x.n===n);if(i>=0)ns.splice(i,1);save();renderDev();renderGrid();return}
 const {s,n}=areaPos(e),note={s,n,l:1};ns.push(note);nd={note,tid:tr.id};audition(tr,n);renderDev()});
window.addEventListener('mousemove',e=>{if(!nd||!$('#area'))return;const {s}=areaPos(e),l=Math.max(1,s-nd.note.s+1);if(l!==nd.note.l){nd.note.l=l;renderDev()}});
window.addEventListener('mouseup',()=>{if(paint){paint=null;save()}if(nd){nd=null;save();renderGrid()}});
/* клавиатура */
const KEYMAP={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12};
document.addEventListener('keydown',e=>{const tag=e.target.tagName,typing=tag==='INPUT'&&e.target.type!=='range'&&e.target.type!=='checkbox'||tag==='SELECT';
 if(e.code==='Escape'){$('#menu').hidden=true;if(!$('#help').hidden)ACT.closehelp();return}
 if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'&&!typing){e.preventDefault();ACT.undo();return}
 if((e.ctrlKey||e.metaKey)&&e.code==='KeyS'){e.preventDefault();ACT.saveproj();return}
 if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==='Space'){e.preventDefault();if(e.target.tagName==='BUTTON')e.target.blur();ACT.play();return}
 if(e.code in KEYMAP&&!e.repeat){const tr=T(sel);if(tr)audition(tr,(tr.type==='synth'?(SYNTHS[tr.preset]||SYNTHS.bass).key:60)+KEYMAP[e.code])}});
/* перетаскивание: файлы с компа и звуки из списка */
function readEntry(en,path,out){return new Promise(res=>{if(en.isFile)en.file(f=>{out.push({f,folder:path});res()},()=>res());
 else if(en.isDirectory){const rd=en.createReader(),sub=path?path+' / '+en.name:en.name;const loop=()=>rd.readEntries(async es=>{if(!es.length)return res();for(const x of es)await readEntry(x,sub,out);loop()},()=>res());loop()}else res()})}
let dragDepth=0;const isFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(isFiles(e)){dragDepth++;document.body.classList.add('dragging')}});
window.addEventListener('dragleave',e=>{if(isFiles(e)&&--dragDepth<=0){dragDepth=0;document.body.classList.remove('dragging')}});
window.addEventListener('dragover',e=>{e.preventDefault();const row=e.target.closest&&e.target.closest('.row');$$('.row.over').forEach(r=>r!==row&&r.classList.remove('over'));if(row&&!isFiles(e))row.classList.add('over')});
window.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');$$('.row.over').forEach(r=>r.classList.remove('over'));
 if(isFiles(e)){const plain=[...e.dataTransfer.files].map(f=>({f,folder:''})),ents=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean),out=[];
  let hadDir=false;try{for(const en of ents){if(en.isDirectory)hadDir=true;await readEntry(en,'',out)}}catch(err){}
  const use=out.length?out:plain;const n=await importFiles(use);if(!n&&hadDir)toast('Папку так прочитать не вышло — нажми «+ Папка» во вкладке «Мои» и выбери её',6000);return}
 const src=e.dataTransfer.getData('text/plain');if(!/^[bus]:/.test(src))return;const row=e.target.closest('.row');
 if(row&&src[0]!=='s'){const tr=T(row.dataset.tid);if(tr.type==='sample'){pushUndo();tr.src=src;if(/^Дорожка$/.test(tr.name)||BUILTIN.some(b=>b[1]===tr.name)||userSounds.some(u=>u.name===tr.name))tr.name=srcName(src);sel=tr.id;commit();loadBuf(src).then(()=>audition(tr),()=>toast('Этот файл не читается как звук'));return}}
 if(e.target.closest('#work'))addTrackFromSrc(src)});
document.addEventListener('dragstart',e=>{const it=e.target.closest&&e.target.closest('.it');if(it){e.dataTransfer.setData('text/plain',it.dataset.src);e.dataTransfer.effectAllowed='copy'}});
$('#fFiles').addEventListener('change',e=>{importFiles([...e.target.files].map(f=>({f,folder:''})));e.target.value=''});
$('#fDir').addEventListener('change',e=>{importFiles([...e.target.files].map(f=>({f,folder:(f.webkitRelativePath||'').split('/').slice(0,-1).join(' / ')})));e.target.value=''});
$('#fProj').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.tracks)||!Array.isArray(o.patterns)||!o.patterns.length)throw 0;pushUndo();stop();S=Object.assign(emptyProject(),o);sel=S.tracks[0]&&S.tracks[0].id;commit();toast('Проект открыт')}catch(err){toast('Это не файл проекта «Грув»')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){libQ=e.target.value;const pos=e.target.selectionStart;renderLib();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
window.addEventListener('blur',()=>{paint=null});

/* ---------- кадр: бегунок и индикатор уровня ---------- */
const mc=$('#meter').getContext('2d');let lvl=0;
function frame(){requestAnimationFrame(frame);
 if(an){an.getFloatTimeDomainData(mbuf);let p=0;for(let i=0;i<mbuf.length;i++)p=Math.max(p,Math.abs(mbuf[i]));lvl=Math.max(p,lvl*.9)}else lvl=0;
 const cs=getComputedStyle(document.body);mc.clearRect(0,0,96,14);mc.fillStyle=lvl>.95?cs.getPropertyValue('--hot'):cs.getPropertyValue('--accent');mc.fillRect(0,0,Math.min(1,lvl)*96,14);
 if(play.on&&ctx){let cur=null;while(play.q.length&&play.q[0].t<=ctx.currentTime)cur=play.q.shift();
  if(cur){if(cur.pi!==S.cur&&!paint&&!nd){S.cur=cur.pi;renderPats();renderGrid();renderDev()}
   document.body.style.setProperty('--ph',cur.step);
   if(songOn())$$('#song .sc.on').forEach((el,i)=>el.classList.toggle('now',i===cur.pos))}}}

/* ---------- запуск ---------- */
genBuiltins();
document.body.dataset.theme=localStorage.getItem('gruv_theme')||'arbuz';
renderAll();renderLib();requestAnimationFrame(frame);
idb('meta','readonly',s=>s.getAll()).then(a=>{userSounds=a||[];renderLib();renderGrid();renderDev();preload()}).catch(e=>{console.warn('idb',e)});
if(!localStorage.getItem('gruv_seen')){renderHelp();$('#help').hidden=false}
window.__app={get S(){return S},set S(v){S=v},renderSong,encodeWav,importFiles,start,stop,play,loadBuf,BUF,addTrackFromSrc,commit,ACT,get userSounds(){return userSounds},get ctx(){return ctx},get lvl(){return lvl},select};
</script>
